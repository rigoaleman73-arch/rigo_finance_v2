<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Punto de Equilibrio + Chatbot</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1c2430;--mu:#6b7686;--ac:#0f766e;--bd:#e2e6ec;--rd:#c2410c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b212b;--tx:#e8ecf2;--mu:#93a0b3;--ac:#2dd4bf;--bd:#2c3542;--rd:#fb923c}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1b212b;--tx:#e8ecf2;--mu:#93a0b3;--ac:#2dd4bf;--bd:#2c3542;--rd:#fb923c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;padding:16px}
body.tour-active{overflow:hidden}
.tourbtn{border:1px solid rgba(255,255,255,.6);background:transparent;color:#fff;border-radius:12px;padding:2px 12px;cursor:pointer;font-size:12px;margin-left:8px}
.tourhi{outline:3px solid #7c3aed;outline-offset:2px;border-radius:8px}
.w{max-width:760px;margin:auto}
h1{font-size:20px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.mode{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mode button,.st button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:14px}
.mode button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.mode input{width:90px;padding:6px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
.f{margin-bottom:14px}
.f:last-child{margin-bottom:0}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.r label{font-weight:600}
.st{display:flex;gap:4px;align-items:center}
.st input{width:110px;padding:6px;text-align:right;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
input[type=range]{width:100%;accent-color:var(--ac)}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.k div{border:1px solid var(--bd);border-radius:10px;padding:10px}
.k span{display:block;color:var(--mu);font-size:12px}
.k b{font-size:18px}
.big{border-color:var(--ac)!important}.big b{color:var(--ac);font-size:22px}
.svgw{overflow-x:auto}
/* ✅ FIX 9: SVG con display:block + min-height para que no colapsen */
svg{display:block;width:100%;height:auto;min-width:420px;overflow:visible}
#ch{min-height:280px}
#c2,#c3,#c4{min-height:220px}
#c5{min-height:180px}
#msgs{height:230px;overflow-y:auto;border:1px solid var(--bd);border-radius:10px;padding:8px;margin-bottom:8px;display:flex;flex-direction:column;gap:6px}
.m{max-width:85%;padding:7px 10px;border-radius:10px;white-space:pre-wrap;font-size:14px}
.m.u{align-self:flex-end;background:var(--ac);color:#fff}
.m.b{align-self:flex-start;background:var(--bg);border:1px solid var(--bd)}
.cin{display:flex;gap:6px}
.cin input{flex:1;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font-size:15px}
.cin button,.chips button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 12px;cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chips button{font-size:12px;border-radius:14px}
.note{color:var(--mu);font-size:12px;margin-top:6px}
.w{max-width:1280px}
.top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}.top h1{margin:0}.top span{color:var(--mu);font-size:12px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.kc{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:6px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.kc small{color:var(--mu);font-size:11px;display:block}.kc b{font-size:19px}.kc i{font-size:26px;font-style:normal}
@keyframes fl{0%{background:rgba(43,46,214,.22)}100%{background:var(--card)}}.kc.fl{animation:fl .9s}
.grid{display:grid;gap:12px;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-areas:"gc gm gm" "gb gu go" "gb gr gr" "gs gs gs"}
.gc{grid-area:gc}.gm{grid-area:gm}.gb{grid-area:gb}.gu{grid-area:gu}.go{grid-area:go}.gr{grid-area:gr}.gs{grid-area:gs}
@media(max-width:980px){.grid{grid-template-columns:minmax(0,1fr);grid-template-areas:"gc" "gm" "gb" "gu" "go" "gr" "gs"}}
.sem{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:12px;margin-left:auto}
.animbtn{display:none;margin:10px 0 4px;background:#7c3aed;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 2px 6px rgba(124,58,237,.35)}
.animbtn:hover{background:#6d28d9}
.cd{background:var(--card);border:1px solid var(--bd);border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow:hidden;color:var(--tx)}
.ct{background:#2b2ed6;color:#fff;font-weight:700;font-size:13px;padding:6px 10px;display:flex;justify-content:center;align-items:center;gap:10px}
.cb{padding:10px;overflow-x:auto}
.cd svg{min-width:0}.gm svg{min-width:520px}
#msgs{height:280px}
.tg{border:1px solid rgba(255,255,255,.6);background:transparent;color:#fff;border-radius:12px;padding:2px 10px;cursor:pointer;font-size:12px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px}
.tabs button,.ph button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:4px 10px;cursor:pointer;font-size:12px}
.tabs button.on{background:#2b2ed6;color:#fff;border-color:#2b2ed6}
.ph{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;padding:8px;border:1px dashed var(--bd);border-radius:8px}
.mode{margin-bottom:12px}
</style>
</head>
<body>
<div class="w" id="stage" style="transform-origin:0 0;will-change:transform">
<div class="top"><h1>⚖️ Panel de Punto de Equilibrio</h1><span>Escribe o habla con el asistente · todo corre en tu navegador</span><button id="tourBtn" class="animbtn" style="display:inline-block;margin:0 0 0 4px">🎬 Recorrido guiado</button><button id="pngBtn" class="animbtn" style="display:inline-block;margin:0 0 0 4px;background:#0891b2;box-shadow:0 2px 6px rgba(8,145,178,.35)">📷 PNG</button><button id="pdfBtn" class="animbtn" style="display:inline-block;margin:0 0 0 4px;background:#0891b2;box-shadow:0 2px 6px rgba(8,145,178,.35)">📄 PDF</button><span id="semtop" class="sem"></span></div>
<div class="kp" id="kp"></div>
<div class="grid">
<div class="cd gc"><div class="ct">Controles</div><div class="cb">
<div class="mode"><b>Botones ±:</b><button id="mP" class="on">Porcentaje %</button><button id="mI">Importe directo</button><span>Paso:</span><input id="paso" type="number" value="5" min="0" step="any"></div>
<div id="ctl"></div></div></div>
<div class="cd gm"><div class="ct">Punto de equilibrio</div><div class="cb"><svg id="ch" viewBox="0 0 640 300"></svg><button id="animBtn2" class="animbtn">▶ Animar</button></div></div>
<div class="cd gb"><div class="ct">🤖 Asistente <button id="voz" class="tg">🔊 Voz ON</button></div><div class="cb">
<div id="msgs"></div>
<div class="cin"><input id="ci" placeholder="Ej: sube el precio 10%" autocomplete="off"><button id="mic" title="Hablar">🎤</button><button id="cs">Enviar</button></div>
<div class="tabs" id="tabs"></div><div class="ph" id="ph"></div>
<button id="animBtn" class="animbtn">▶ Animar</button>
<div id="chips" style="display:none"></div></div></div>
<div class="cd gu"><div class="ct">Utilidad vs unidades</div><div class="cb"><svg id="c2" viewBox="0 0 400 240"></svg></div></div>
<div class="cd go"><div class="ct">Estructura de costos</div><div class="cb"><svg id="c3" viewBox="0 0 400 240"></svg></div></div>
<div class="cd gr"><div class="ct">Ingresos vs costos vs utilidad</div><div class="cb"><svg id="c4" viewBox="0 0 400 240"></svg></div></div>
<div class="cd gs"><div class="ct">Sensibilidad del punto de equilibrio (±10% por variable)</div><div class="cb"><svg id="c5" viewBox="0 0 800 190"></svg></div></div>
</div>
<div id="res" style="display:none"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
var fmt=function(n){return isFinite(n)?n.toLocaleString('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:2}):'—'};
var num=function(n){return isFinite(n)?n.toLocaleString('es-MX',{maximumFractionDigits:1}):'—'};
var campos=[
 {id:'precio',t:'Precio de Venta (por unidad)',v:100,min:0,max:500,s:1},
 {id:'unidades',t:'Unidades vendidas',v:1000,min:0,max:5000,s:10},
 {id:'cf',t:'Costos Fijos (total)',v:30000,min:0,max:200000,s:500},
 {id:'cv',t:'Costos Variables (por unidad)',v:60,min:0,max:500,s:1}
];
var modo='p';
var S={};
var ctl=document.getElementById('ctl');
campos.forEach(function(c){
  S[c.id]=c.v;
  var d=document.createElement('div');d.className='f';
  d.innerHTML='<div class="r"><label>'+c.t+'</label><div class="st"><button data-a="-">−</button><input type="number" step="any" id="n_'+c.id+'"><button data-a="+">+</button></div></div><input type="range" id="s_'+c.id+'" min="'+c.min+'" max="'+c.max+'" step="'+c.s+'">';
  ctl.appendChild(d);
  var rg=d.querySelector('input[type=range]'),nb=d.querySelector('input[type=number]');
  rg.oninput=function(){set(c,parseFloat(rg.value))};
  nb.oninput=function(){set(c,parseFloat(nb.value)||0,true)};
  d.querySelectorAll('button').forEach(function(b){b.onclick=function(){
    var p=parseFloat(document.getElementById('paso').value)||0;
    var delta=modo==='p'?S[c.id]*p/100:p;
    set(c,S[c.id]+(b.dataset.a==='+'?delta:-delta),true);
  }});
});
function set(c,val,fromNum){
  if(typeof pararAnim==='function')pararAnim();
  /* ✅ FIX 1: rechaza NaN/undefined antes de guardar */
  if(typeof val!=='number'||!isFinite(val))val=0;
  val=Math.max(0,Math.round(val*100)/100);
  S[c.id]=val;
  var rg=document.getElementById('s_'+c.id);
  if(val>+rg.max)rg.max=Math.ceil(val*1.5);
  rg.value=val;
  var nb=document.getElementById('n_'+c.id);
  if(!fromNum||document.activeElement!==nb)nb.value=val;
  calc();
}
document.getElementById('mP').onclick=function(){modo='p';this.classList.add('on');document.getElementById('mI').classList.remove('on');document.getElementById('paso').value=5};
document.getElementById('mI').onclick=function(){modo='i';this.classList.add('on');document.getElementById('mP').classList.remove('on');document.getElementById('paso').value=10};

function calc(){
  var P=S.precio,U=S.unidades,CF=S.cf,CV=S.cv;
  var mc=P-CV,peU=mc>0?CF/mc:Infinity,peD=peU*P;
  var ing=P*U,ct=CF+CV*U,ut=ing-ct;
  var ms=U>0&&isFinite(peU)?(U-peU)/U*100:NaN;
  var items=[
   ['Margen de contribución / unidad',fmt(mc)],
   ['Ingresos actuales',fmt(ing)],
   ['Costos totales',fmt(ct)],
   ['Utilidad actual',fmt(ut)],
   ['Margen de seguridad',isFinite(ms)?num(ms)+' %':'—']
  ];
  var h='<div class="big"><span>Punto de equilibrio (unidades)</span><b>'+(mc>0?num(peU):'Sin equilibrio (precio ≤ costo variable)')+'</b></div>'+
        '<div class="big"><span>Punto de equilibrio (importe)</span><b>'+(mc>0?fmt(peD):'—')+'</b></div>';
  items.forEach(function(i){h+='<div><span>'+i[0]+'</span><b>'+i[1]+'</b></div>'});
  document.getElementById('res').innerHTML=h;
  if(typeof dibuja==='function')dibuja(P,CF,CV,U,peU);
}
function dibujaSimple(P,CF,CV,U,peU){
  var xmax=Math.max(U,isFinite(peU)?peU:0,1)*1.4,ymax=Math.max(P*xmax,CF+CV*xmax,1);
  var L=60,R=590,T=10,B=230;
  var X=function(x){return L+(x/xmax)*(R-L)},Y=function(y){return B-(y/ymax)*(B-T)};
  var s='<line x1="'+L+'" y1="'+B+'" x2="'+R+'" y2="'+B+'" stroke="currentColor" opacity=".3"/><line x1="'+L+'" y1="'+T+'" x2="'+L+'" y2="'+B+'" stroke="currentColor" opacity=".3"/>';
  s+='<line x1="'+X(0)+'" y1="'+Y(0)+'" x2="'+X(xmax)+'" y2="'+Y(P*xmax)+'" stroke="#0f9d8a" stroke-width="2.5"/>';
  s+='<line x1="'+X(0)+'" y1="'+Y(CF)+'" x2="'+X(xmax)+'" y2="'+Y(CF+CV*xmax)+'" stroke="#e2622b" stroke-width="2.5"/>';
  s+='<line x1="'+X(0)+'" y1="'+Y(CF)+'" x2="'+X(xmax)+'" y2="'+Y(CF)+'" stroke="#8892a3" stroke-dasharray="4 4"/>';
  if(isFinite(peU)&&peU<=xmax){s+='<circle cx="'+X(peU)+'" cy="'+Y(peU*P)+'" r="6" fill="#111" stroke="#fff" stroke-width="2"/><text x="'+(X(peU)+8)+'" y="'+(Y(peU*P)-8)+'" font-size="12" fill="currentColor">PE: '+num(peU)+' u</text>'}
  s+='<line x1="'+X(U)+'" y1="'+T+'" x2="'+X(U)+'" y2="'+B+'" stroke="currentColor" opacity=".35" stroke-dasharray="2 4"/><text x="'+(X(U)-4)+'" y="'+(B+16)+'" font-size="11" text-anchor="end" fill="currentColor">Unidades actuales</text>';
  s+='<text x="'+(L+6)+'" y="'+(T+12)+'" font-size="12" fill="#0f9d8a">— Ingresos</text><text x="'+(L+90)+'" y="'+(T+12)+'" font-size="12" fill="#e2622b">— Costos totales</text><text x="'+(L+200)+'" y="'+(T+12)+'" font-size="12" fill="#8892a3">- - Costos fijos</text>';
  document.getElementById('ch').innerHTML=s;
}
function pe_cargarGuardado(){
  try{if(location.hash&&location.hash.length>1){var h=JSON.parse(decodeURIComponent(location.hash.slice(1)));if(h&&typeof h.precio==='number'&&typeof h.unidades==='number'&&typeof h.cf==='number'&&typeof h.cv==='number')return h}}catch(e){}
  try{var raw=localStorage.getItem('pe_dashboard_v1');if(raw){var p=JSON.parse(raw);if(p&&typeof p.precio==='number')return p}}catch(e){}
  return null;
}
var pe_guardado=pe_cargarGuardado();
campos.forEach(function(c){set(c,(pe_guardado&&typeof pe_guardado[c.id]==='number')?pe_guardado[c.id]:c.v)});
</script>

<script>
var SIN=[
 {k:'precio',t:['precio','precio de venta','venta','pvp']},
 {k:'unidades',t:['unidades','piezas','volumen','cantidad','ventas en unidades']},
 {k:'cf',t:['costos fijos','costo fijo','gastos fijos','fijos']},
 {k:'cv',t:['costos variables','costo variable','variables','costo unitario']}
];
var TERMS=[];SIN.forEach(function(s){s.t.forEach(function(t){TERMS.push({k:s.k,t:t})})});
var norm=function(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')};
function lev(a,b){var m=[],i,j;for(i=0;i<=a.length;i++){m[i]=[i]}for(j=1;j<=b.length;j++)m[0][j]=j;
  for(i=1;i<=a.length;i++)for(j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return m[a.length][b.length]}
function campo(txt){
  var w=txt.replace(/[^a-z0-9% ]/g,' ').split(/\s+/).filter(Boolean),best=null,g=[];
  for(var i=0;i<w.length;i++){g.push(w[i]);if(i+1<w.length)g.push(w[i]+' '+w[i+1])}
  g.forEach(function(x){
    if(x.length<4||/^\d/.test(x))return;
    TERMS.forEach(function(t){
      var d=lev(x,t.t);if(d>Math.floor(t.t.length/5))return;
      var sc=d/t.t.length;
      if(!best||sc<best.s-1e-9||(Math.abs(sc-best.s)<1e-9&&x.length>best.l))best={k:t.k,s:sc,l:x.length};
    });
  });
  return best?best.k:null;
}
var NOM={precio:'Precio de Venta',unidades:'Unidades',cf:'Costos Fijos',cv:'Costos Variables'};
function C(k){return campos.filter(function(c){return c.id===k})[0]}
function st(){var mc=S.precio-S.cv,pe=mc>0?S.cf/mc:Infinity;return{mc:mc,pe:pe,ut:S.precio*S.unidades-S.cf-S.cv*S.unidades}}
function resumen(){var s=st();return s.mc>0?'Punto de equilibrio: '+num(s.pe)+' unidades ('+fmt(s.pe*S.precio)+').\nUtilidad actual: '+fmt(s.ut)+'.':'Con el precio actual no hay equilibrio: el precio debe ser mayor al costo variable.'}
function cmd(t){
  var n=t.match(/(\d+(?:\.\d+)?)\s*(%|por ?ciento)?/),val=n?parseFloat(n[1]):null,pct=n&&!!n[2];
  var k=campo(t);
  var m=t.match(/(?:ganar|utilidad(?: objetivo| de)?)\s*\$?\s*(\d+(?:\.\d+)?)/);
  if(m){var mc=S.precio-S.cv;if(mc<=0)return 'Con este precio y costo variable no hay margen positivo.';var u=(S.cf+parseFloat(m[1]))/mc;TARGET={u:u,label:'Meta: '+fmt(parseFloat(m[1]))};REF=null;if(typeof dibuja==='function')dibuja();return 'Para ganar '+fmt(parseFloat(m[1]))+' necesitas vender '+num(u)+' unidades ('+fmt(u*S.precio)+' en ventas). Marcado en la gráfica.'}
  if(/reinicia|restablece|reset/.test(t)){campos.forEach(function(c){set(c,c.v)});return 'Valores restablecidos.\n'+resumen()}
  if(k&&val!==null){
    var up=/\b(sube|subir|aumenta|incrementa|suma|sumale|mas)\b/.test(t),dn=/\b(baja|bajar|reduce|disminuye|resta|quita|menos)\b/.test(t),c=C(k),old=S[k],nv;
    if(up||dn){var d=pct?old*val/100:val;nv=old+(up?d:-d)}else nv=pct?old*(1+val/100):val;
    set(c,nv);
    return NOM[k]+': '+num(old)+' → '+num(S[k])+'.\n'+resumen();
  }
  if(k&&val===null)return NOM[k]+' actual: '+num(S[k])+'.';
  if(!k&&val!==null&&/\b(sube|subir|aumenta|incrementa|suma|sumale|mas|baja|bajar|reduce|disminuye|resta|quita|menos)\b/.test(t)){
    var up2=/\b(sube|subir|aumenta|incrementa|suma|sumale|mas)\b/.test(t),c2=C('precio'),old2=S.precio,d2=pct?old2*val/100:val,nv2=old2+(up2?d2:-d2);
    set(c2,nv2);
    return '⚠️ No dijiste a qué aplicarlo, así que asumí el Precio de Venta (di "sube el precio", "sube costos fijos", etc. para elegir otro).\n'+NOM.precio+': '+num(old2)+' → '+num(S.precio)+'.\n'+resumen();
  }
  if(/equilibrio|breakeven|break even|resumen|estado|utilidad|ganancia/.test(t))return resumen();
  if(/margen/.test(t)){var s=st();return 'Margen de contribución: '+fmt(s.mc)+' por unidad ('+num(S.precio?s.mc/S.precio*100:0)+' %).'}
  if(/ayuda|help|que puedes|como/.test(t))return 'Puedo ajustar valores y responder preguntas:\n• "sube el precio 10%"\n• "baja costos variables 5"\n• "pon unidades en 1500"\n• "cuál es el punto de equilibrio"\n• "cuántas unidades para ganar 20000"\n• "reinicia"';
  return 'No lo entendí. Escribe "ayuda" para ver ejemplos.';
}
function add(c,x){var d=document.createElement('div');d.className='m '+c;d.textContent=x;var b=document.getElementById('msgs');b.appendChild(d);b.scrollTop=b.scrollHeight}
function send(txt){
  txt=(txt||document.getElementById('ci').value).trim();if(!txt)return;
  document.getElementById('ci').value='';add('u',txt);
  var t=w2n(norm(txt)).replace(/(\d),(\d{3})/g,'$1$2'),parts=t.split(/\s+y\s+|;/),out=[];
  parts.forEach(function(p){out.push(cmd(p))});
  add('b',out.join('\n\n'));
}
document.getElementById('cs').onclick=function(){send()};
document.getElementById('ci').addEventListener('keydown',function(e){if(e.key==='Enter'||e.keyCode===13){e.preventDefault();send()}});
['Punto de equilibrio','Sube el precio 10%','Baja costos fijos 5000','Pon unidades en 1500','Unidades para ganar 20000','Ayuda'].forEach(function(x){var b=document.createElement('button');b.textContent=x;b.onclick=function(){send(x)};document.getElementById('chips').appendChild(b)});
add('b','Hola, soy el asistente local. Puedes escribir o usar el micrófono 🎤.\nPuedo mover los valores del modelo y calcular el equilibrio. Escribe "ayuda" para ver ejemplos.');

function w2n(t){

function svgToPng(svgEl,scale){
  return new Promise(function(resolve){
    try{
      var xml=new XMLSerializer().serializeToString(svgEl);
      var svg64=btoa(unescape(encodeURIComponent(xml)));
      var img=new Image();
      var vb=svgEl.viewBox&&svgEl.viewBox.baseVal,w=(vb&&vb.width)||640,h=(vb&&vb.height)||300;
      img.onload=function(){
        var c=document.createElement('canvas');c.width=w*scale;c.height=h*scale;
        var ctx=c.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,c.width,c.height);ctx.scale(scale,scale);ctx.drawImage(img,0,0,w,h);
        resolve({url:c.toDataURL('image/png'),w:w,h:h});
      };
      img.onerror=function(){resolve(null)};
      img.src='data:image/svg+xml;base64,'+svg64;
    }catch(e){resolve(null)}
  });
}
function exportarPDF(){

    next();
  }catch(e){add0('b','⚠️ No se pudo generar el PDF: '+e.message)}
}
