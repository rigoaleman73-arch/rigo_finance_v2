<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Intelligence Dashboard | Rigo Finance V3.9</title>
  
  <link rel="stylesheet" href="../css/global.css">
  
  <style>
    /* =========================================
       1. TEMA OSCURO PREMIUM GENERAL
       ========================================= */
    main.section {
      background: #0a0a0a !important; 
      color: #e2e8f0 !important; 
      min-height: 100vh !important;
      padding: 60px 20px !important;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    
    /* =========================================
       2. BANNER SUPERIOR CON EFECTO ESPACIO (Solo CSS)
       ========================================= */
    .ai-hero {
      position: relative;
      background: #02040a; /* Negro profundo espacial */
      border: 1px solid #1e3c23;
      border-radius: 12px;
      padding: 5rem 2rem;
      text-align: center;
      margin: 0 auto 3rem auto;
      max-width: 1200px;
      overflow: hidden; 
      box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
    }

    /* El Planeta Tierra */
    .ai-hero::before {
      content: '';
      position: absolute;
      bottom: -150px; 
      left: -10%;
      width: 120%;
      height: 300px;
      background: #061121;
      border-radius: 50% 50% 0 0; 
      box-shadow: 
        inset 0 20px 40px rgba(0, 150, 255, 0.4), 
        0 -10px 50px rgba(0, 150, 255, 0.5); 
      z-index: 0;
    }

    /* La Luna (Media Luna) */
    .ai-hero::after {
      content: '';
      position: absolute;
      top: 40px;
      left: 15%;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      box-shadow: inset -15px 0 0 0 #e2e8f0;
      filter: drop-shadow(0 0 10px rgba(255,255,255,0.3));
      transform: rotate(-20deg);
      z-index: 0;
    }

    /* Las Estrellas */
    .stars {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: 
        radial-gradient(1px 1px at 10% 20%, white, transparent),
        radial-gradient(1px 1px at 40% 70%, rgba(255,255,255,0.8), transparent),
        radial-gradient(2px 2px at 80% 30%, rgba(255,255,255,0.6), transparent),
        radial-gradient(1.5px 1.5px at 60% 10%, white, transparent),
        radial-gradient(1px 1px at 90% 80%, rgba(255,255,255,0.5), transparent);
      background-size: 200px 200px;
      z-index: 0;
      opacity: 0.6;
    }

    /* Asegurar que el texto esté por encima del espacio */
    .ai-hero h2, .ai-hero p {
      position: relative;
      z-index: 2;
      text-shadow: 0 4px 10px rgba(0,0,0,0.8);
    }
    
    .ai-hero h2 { color: #fff; font-size: 2.2rem; margin-top: 0; }
    .ai-hero p { color: #b0b0d0; max-width: 700px; margin: 1rem auto 0 auto; font-size: 1.1rem; }

    /* =========================================
       3. PESTAÑAS (TABS)
       ========================================= */
    .tabs-container {
      display: flex;
      gap: 12px;
      margin-bottom: 40px;
      flex-wrap: wrap;
      max-width: 1200px;
      margin: 0 auto 40px auto;
    }
    .tab-button {
      background: #131c2e;
      color: #94a3b8;
      border: 1px solid #1e293b;
      padding: 10px 20px;
      border-radius: 50px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }
    .tab-button:hover { background: #1e293b; color: #ffffff; }
    .tab-button.active-tab {
      background: #10b981;
      color: #0a0a0a;
      border-color: #10b981;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
    }

    /* =========================================
       4. GRID DE TARJETAS Y LIMPIADOR CSS
       ========================================= */
    .cards, #dynamic-cards-container {
      display: grid !important;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)) !important; 
      gap: 24px !important;
      max-width: 1200px !important;
      margin: 0 auto !important;
    }

    /* La Tarjeta */
    .cards > *, #dynamic-cards-container > * {
      background: #1a1a1a !important; 
      border: 1px solid #333 !important;
      border-radius: 12px !important;
      padding: 24px !important;
      display: flex !important;
      flex-direction: column !important;
      height: auto !important;
      transition: all 0.3s ease !important;
      position: relative;
    }
    
    .cards > *:hover, #dynamic-cards-container > *:hover {
      border-color: #10b981 !important;
      transform: translateY(-5px) !important;
      box-shadow: 0 8px 25px rgba(16, 185, 129, 0.15) !important;
    }

    /* Etiqueta Superior (Badge) */
    .cards > *::before, #dynamic-cards-container > *::before {
      content: "MODELO_FINANCIERO";
      display: inline-block;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: bold;
      font-family: monospace;
      border: 1px solid rgba(16, 185, 129, 0.3);
      margin-bottom: 15px;
      width: fit-content;
    }

    /* Títulos */
    .cards > * h1, .cards > * h2, .cards > * h3, .cards > * h4,
    #dynamic-cards-container > * h1, #dynamic-cards-container > * h2, #dynamic-cards-container > * h3, #dynamic-cards-container > * h4 {
      color: #ffffff !important;
      font-size: 1.25rem !important;
      margin: 0 0 12px 0 !important;
      line-height: 1.4 !important;
    }

    /* Texto Cortado a 3 líneas */
    .cards > * p, #dynamic-cards-container > * p {
      color: #a1a1aa !important;
      font-size: 0.95rem !important;
      line-height: 1.6 !important;
      margin: 0 !important;
      display: -webkit-box !important;
      -webkit-line-clamp: 3 !important; 
      -webkit-box-orient: vertical !important;
      overflow: hidden !important;
      text-overflow: ellipsis !important;
    }
    
    /* Ocultar imágenes de forma nativa */
    #dynamic-cards-container img { display: none !important; }
  </style>
</head>
<body>

  <header id="site-header"></header>

  <main class="section">
    
    <!-- Banner Superior con Efecto Espacial -->
    <div class="ai-hero">
      <div class="stars"></div>
      <h2>💼 Intelligence Suite</h2>
      <p>Explora los modelos predictivos, herramientas de FP&A y arquitecturas de datos desplegadas para la toma de decisiones estratégicas.</p>
    </div>
    
    <!-- Pestañas -->
    <div class="tabs-container">
      <button class="tab-button active-tab" onclick="cambiarPestaña('Todos', this)">🎰 Todos los Modelos</button>
      <button class="tab-button" onclick="cambiarPestaña('Planeación y FP&A', this)">📊 Planeación y FP&A</button>
      <button class="tab-button" onclick="cambiarPestaña('Rentabilidad y Pricing', this)">🎯 Rentabilidad y Pricing</button>
      <button class="tab-button" onclick="cambiarPestaña('Fiscal / Contable', this)">💼 Fiscal / Contable</button>
      <button class="tab-button" onclick="cambiarPestaña('Modelos Especiales', this)">💎 Modelos Especiales</button>
    </div>

    <!-- Contenedor Dinámico (Supabase) -->
    <div class="cards" id="dynamic-cards-container"></div>
    
  </main>

  <footer id="site-footer"></footer>

  <script src="../js/navigation.js"></script>
  <script src="../js/supabase-local.js"></script>

  <script>
    // Inicialización de Supabase
    const SUPABASE_URL = "https://tktomsbcxyaotgbbqszt.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_EYgWbGKyDFrp1vImvcsCAw_CFJfxOpQ";
    if (window.supabase) {
      window.supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }
  </script>

  <script>
    // Carga del motor dinámico con protección anti-caché
    const script = document.createElement('script');
    script.src = "../js/intelligency.js?t=" + String(new Date().getTime());
    document.body.appendChild(script);
  </script>

  <!-- EL LIMPIADOR DOM (Elimina imágenes y colapsa espacios vacíos del JS) -->
  <script>
    setInterval(() => {
      // 1. Eliminar imágenes
      const images = document.querySelectorAll('#dynamic-cards-container img');
      images.forEach(img => img.remove());

      // 2. Colapsar contenedores vacíos
      const innerDivs = document.querySelectorAll('#dynamic-cards-container > * > div');
      innerDivs.forEach(div => {
        if (div.textContent.trim() === '' && div.children.length === 0) {
          div.style.display = 'none';
        } else {
          div.style.height = 'auto';
          div.style.minHeight = '0';
          div.style.padding = '0';
          div.style.margin = '0';
        }
      });

      // 3. Asegurar altura automática
      const parentCards = document.querySelectorAll('#dynamic-cards-container > *');
      parentCards.forEach(card => {
        card.style.height = 'auto';
        card.style.minHeight = '0';
      });
    }, 300);
  </script>

</body>
</html>
